# Flatpak manifest skeleton. The runtime and SDK are pinned; the app module
# builds from this checkout. Submit to Flathub with a signed tag once releases
# are signed by the maintainers.
id: io.github.sakib669.UniDB
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: unidb
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --talk-name=org.freedesktop.secrets
modules:
  - name: unidb
    buildsystem: simple
    build-commands:
      - cargo build --release --features gui
      - install -Dm755 target/release/unidb /app/bin/unidb
      - install -Dm644 assets/io.github.sakib669.UniDB.desktop /app/share/applications/io.github.sakib669.UniDB.desktop
      - install -Dm644 assets/io.github.sakib669.UniDB.svg /app/share/icons/hicolor/scalable/apps/io.github.sakib669.UniDB.svg
      - install -Dm644 assets/io.github.sakib669.UniDB.metainfo.xml /app/share/metainfo/io.github.sakib669.UniDB.metainfo.xml
    sources:
      - type: dir
        path: .
